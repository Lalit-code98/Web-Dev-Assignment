<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <p>Please fill in your details to register for the course.</p>
    <form action="#" method="post" autocomplete="on">
        <fieldset>
            <legend>Personal Information</legend>

            <!-- Text Input -->
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name"
                minlength="3" maxlength="50" required autocomplete="name">
            <br><br>

            <!--Email Input-->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Student@example.com" required>
            <br><br>

            <!--Password-->
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" minlength="8" maxlength="20"
            placeholder="Minimun 8 characters" required>
            <br><br>

            <!--Telephone no.-->
            <label for="phone">Mobile Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter mobile number" pattern="[0-9]{10}"
                title="Enter a 10 digit mobile number" required>
            <br><br>

            <!--Number Input-->
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="16" max="60" step="1" value="18" required>
            <br><br>

            <!--Datetime-local input-->
            <label for="meeting">Counselling Date and Time</label>
            <input type="datetime-local" id="meeting" name="meeting">
            <br><br>

            <!--URL-->
            <label for="portfolio">Portfolio Website:</label>
            <input type="url" id="portfolio" name="portfolio" placeholder="https://example.com">
            <br><br>

            <!--Radio Buttons-->
            <p>Gender</p>
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female" required>
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other" required>
            <label for="other">Male</label>
            <br><br>

            <!--checkbox-->
            <p>Interests</p>
            <input type="checkbox" id="web" name="interests" value="Web Development">
            <label for="web">Web Development</label>

            <input type="checkbox" id="java" name="interests" value="Java">
            <label for="java">Java</label>

            <input type="checkbox" id="ai" name="interests" value="AI">
            <label for="ai">Artificial Intelligence</label>
            <br><br>

            <!--Selet dropdown-->
            <label for="course">Select Course:</label>
            <select id="course" name="course" required>
                <option value="">--Select a Course--</option>
                <option value="BTech">BTech CSE</option>
                <option value="BCA">BCA</option>
                <option value="MCA">MCA</option>
            </select>
            <br><br>

            <!--Multiple select using optgroup-->
            <label for="city">Preferred Campus:</label>
            <select id="city" name="campus">
                <optgroup label="Rajasthan">
                    <option value="Jaipur">Jaipur</option>
                    <option value="Jodhpur">Jodhpur</option>
                </optgroup>
                <optgroup label="Other States">
                    <option value="Delhi">Delhi</option>
                    <option value="Gurugram">Gurugram</option>
                </optgroup>
            </select>
            <br><br>

            <!--Datalist-->
            <label for="qualification">Previous Qualification:</label>
            <input list="qualifications" id="qualification" name="qualification" placeholder="Type pr select">
            <datalist id="qualifications">
                <option value="Class 12">
                <option value="Diploma">
                <option value="Graduation">
            </datalist>
            <br><br>

            <!--File Input-->
            <label for="photo">Upload Photograph:</label>
            <input type="file" id="photo" name="photo" accept="image/*">
            <br><br>

        </fieldset>

        <fieldset>
            <legend>Additional Information</legend>
            <!--Text Area-->
            <label for="address">Address</label><br>
            <textarea id="textarea" name="address" rows="4" cols="40" placeholder="Enter your address"
                maxlength="200"></textarea>
            <br><br>

            <!--Consent checkbox-->
            <input type="checkbox" id="terms" name="terms" value="accepted" required>
            <label for="terms">I agree to the registration terms.</label>
            <br><br>
            <input type="checkbox" id="notification" name="notification" value="accepted" required>
            <label for="notification">I agree to get Informations.</label>
            <br><br>
        </fieldset>
        
        <!--Submit and Reset button-->
        <button type="submit">Submit</button>
        <button type="reset">Clear Form</button>
        <br><br>

    </form>
</body>
</html>
